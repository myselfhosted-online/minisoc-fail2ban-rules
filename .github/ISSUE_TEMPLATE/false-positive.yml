name: False positive
description: Report a legitimate request matched by a rule
title: "[False positive] "
labels: ["false-positive"]
body:
  - type: input
    id: rule
    attributes:
      label: Rule or signature
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: Sanitized request/log
      description: Remove credentials, cookies, tokens and private data.
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why this request is legitimate
    validations:
      required: true
