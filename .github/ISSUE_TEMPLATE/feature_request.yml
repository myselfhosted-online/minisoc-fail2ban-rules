name: Feature request
description: Suggest an improvement to detection, correlation, reporting, or tooling
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: "Describe the problem and desired outcome. Do not include credentials, private infrastructure details or sensitive logs."
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: validation
    attributes:
      label: Acceptance criteria and testing
      description: "How should we verify the feature without regressions or false positives?"
